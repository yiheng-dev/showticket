server:
  port: 8082
  tomcat:
    threads:
      max: 25
    accept-count: 25
    max-connections: 100
feign:
  okhttp:
    enabled: true
#  sentinel:
#    enabled: true
ticket:
  db:
    database: ticket_selection
  swagger:
    title: "演出票务平台·选票清单服务接口文档"
    package: com.showticket.selection.controller
  selection:
    max-selections: 20
spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090 # sentinel的控制台地址
      http-method-specify: true # 是否设置请求方式作为资源名称
