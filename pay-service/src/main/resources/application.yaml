server:
  port: 8086
spring:
  application:
    name: pay-service # 微服务名称
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${ticket.db.host}:3306/ticket_pay?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${ticket.db.pw}
  cloud:
    nacos:
      server-addr: 192.168.17.130:8848
  rabbitmq:
    host: 192.168.17.130
    port: 5672
    virtual-host: /
    username: yilu
    password: 123456
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.showticket: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 演出票务平台·支付服务接口文档
    description: "演出票务平台·支付服务接口文档"
    email: dev@showticket.local
    concat: ShowTicket
    url: http://localhost:8086
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.showticket.pay.controller
