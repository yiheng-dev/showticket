server:
  port: 8084
spring:
  application:
    name: user-service # 微服务名称
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${ticket.db.host}:3306/ticket_user?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${ticket.db.pw}
  cloud:
    nacos:
      server-addr: 192.168.17.130:8848
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.showticket: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 演出票务平台·用户服务接口文档
    description: "演出票务平台·用户服务接口文档"
    email: dev@showticket.local
    concat: ShowTicket
    url: http://localhost:8084
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.showticket.user.controller
ticket:
  jwt:
    location: classpath:showticket.jks
    alias: showticket
    password: showticket123
    tokenTTL: 30m
